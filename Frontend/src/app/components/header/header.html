<header class="header">
  <div class="container header-content">
    <a routerLink="/" class="brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Training Courses</span>
        <span class="brand-subtitle">Enterprise Academy</span>
      </div>
    </a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
      <a routerLink="/courses" routerLinkActive="active" class="nav-link">Courses</a>
      <a routerLink="/trainers" routerLinkActive="active" class="nav-link">Trainers</a>
      <a routerLink="/my-registrations" routerLinkActive="active" class="nav-link">My Registrations</a>
    </nav>

    <div class="header-actions">
      <ng-container *ngIf="auth.isAuthenticated(); else loginBtn">
        <div class="user-pill">
          <span class="user-name">{{ auth.currentUser()?.fullName }}</span>
          <span class="user-role">Admin</span>
        </div>
        <a routerLink="/admin/dashboard" class="btn btn-outline btn-sm">Dashboard</a>
        <a routerLink="/admin/manage" class="btn btn-outline btn-sm">Manage</a>
        <button (click)="onLogout()" class="btn btn-danger btn-sm">Logout</button>
      </ng-container>
      <ng-template #loginBtn>
        <a routerLink="/admin/login" class="btn btn-outline btn-sm">Admin Portal</a>
      </ng-template>
    </div>
  </div>
</header>
